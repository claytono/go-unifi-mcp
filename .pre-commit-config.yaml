# Exclude vendored files synced from upstream go-unifi
exclude: ^internal/gounifi/

# nodeenv's default "latest" can resolve to a Node pre-release it can't
# install, and CI would otherwise use the runner's Node instead.
default_language_version:
  node: lts

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --list-different --ignore-unknown
        language: node
        additional_dependencies: [prettier@3.9.10]
        types: [text]
        types_or: [json, markdown, yaml]

  - repo: local
    hooks:
      - id: nix-flake-build
        name: nix-flake-build
        entry: bash -c 'nix build --no-link'
        language: system
        pass_filenames: false
        files: ^(flake\.nix|flake\.lock|go\.mod|go\.sum)$

      - id: golangci-lint
        name: golangci-lint
        entry:
          bash -c 'export GOPATH="$(pwd)/.go" GOMODCACHE="$(pwd)/.go/pkg/mod"
          GOCACHE="$(pwd)/.go/cache" && nix develop --command golangci-lint run
          --fix ./...'
        language: system
        pass_filenames: false
        files: \.go$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://gitlab.com/schmieder.matthias/python-kacl
    rev: v0.7.7
    hooks:
      - id: kacl-verify

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: [--config=.zizmor.yml]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.225.1
    hooks:
      - id: renovate-config-validator

  - repo: local
    hooks:
      - id: go-test-coverage
        name: go-test-coverage
        entry:
          bash -c 'export GOPATH="$(pwd)/.go" GOMODCACHE="$(pwd)/.go/pkg/mod"
          GOCACHE="$(pwd)/.go/cache" && nix develop --command bash -c "go test
          -coverprofile=coverage.out ./... && go-test-coverage --config
          .testcoverage.yaml"'
        language: system
        pass_filenames: false
        files: \.go$

      - id: beads-flush
        name: beads-flush
        entry:
          bash -c 'command -v bd >/dev/null && bd sync --flush-only || true'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

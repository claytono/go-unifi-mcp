---
name: Fix Flake Hashes in Renovate PRs

# Automatically updates flake.nix hashes for Renovate PRs that bump versions
# in go modules or flake-managed tools.

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  fix-flake-hashes:
    name: Fix Flake Hashes
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]') ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
      && github.ref_name != github.event.repository.default_branch)

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: claytono
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Refresh fixed-output source hashes
        run: scripts/fix-cross-platform-hashes

      - name: Build to detect hash mismatches
        run: |
          nix build --no-link 2>&1 || true
          nix build .#devShells.x86_64-linux.default --no-link 2>&1 || true

      - name: Fix detected hash mismatches
        run: determinate-nixd fix hashes --auto-apply

      - name: Verify corrected hashes
        run: |
          nix build --no-link
          nix build .#devShells.x86_64-linux.default --no-link

      - name: Check for changes
        id: check-changes
        run: |
          if ! git diff --quiet; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Flake hash fixes detected:"
            git diff --stat
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No hash fixes needed"
          fi

      - name: Commit and push fixes
        if: steps.check-changes.outputs.changes == 'true'
        env:
          BRANCH_NAME:
            ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "Update flake hashes"
          echo "Pushing fixes to branch: $BRANCH_NAME"
          git push "https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}" "HEAD:$BRANCH_NAME"
